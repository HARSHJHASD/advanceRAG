<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Advanced RAG Playground</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        background: white;
        padding: 30px;
        border-radius: 12px;
      }

      h1 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
        margin-bottom: 8px;
        font-weight: bold;
      }

      select {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      textarea {
        width: 100%;
        height: 120px;
        padding: 15px;
        margin-top: 15px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: vertical;
      }

      button {
        margin-top: 15px;
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        background: black;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.8;
      }

      #result {
        margin-top: 30px;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 8px;
      }

      .hidden {
        display: none;
      }

      .source-card {
        margin-top: 15px;
        padding: 15px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .distance {
        font-size: 14px;
        margin-top: 10px;
      }

      .relevant {
        font-weight: bold;
        margin-left: 10px;
      }

      .rejected {
        font-weight: bold;
        margin-left: 10px;
      }

      hr {
        margin: 30px 0;
        border: none;
        border-top: 1px solid #ddd;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Advanced RAG Playground 🚀</h1>

      <p>
        Ask questions about the documents stored in the vector database.
      </p>

      <!-- ========================= -->
      <!-- TOPIC FILTER -->
      <!-- ========================= -->

      <label for="topic">Select Topic</label>

      <select id="topic">
        <option value="all">Search All Topics</option>
        <option value="astronomy">Astronomy</option>
        <option value="programming">Programming</option>
        <option value="artificial-intelligence">
          Artificial Intelligence
        </option>
      </select>

      <!-- ========================= -->
      <!-- QUESTION -->
      <!-- ========================= -->

      <textarea
        id="question"
        placeholder="Ask a question..."
      ></textarea>

      <button onclick="askQuestion()">
        Ask Question
      </button>

      <!-- ========================= -->
      <!-- RESULTS -->
      <!-- ========================= -->

      <div id="result" class="hidden"></div>
    </div>

    <script>
      // This must match your backend similarity threshold.
      // Change it here if your backend uses a different value.
      const DISTANCE_THRESHOLD = 0.8;

      // =========================
      // ASK QUESTION
      // =========================

      async function askQuestion() {
        const question =
          document.getElementById("question").value;

        const topic =
          document.getElementById("topic").value;

        const result =
          document.getElementById("result");

        if (!question.trim()) {
          alert("Please enter a question");
          return;
        }

        result.classList.remove("hidden");

        result.innerHTML = `
          🔍 Searching knowledge base...
        `;

        try {
          const response = await fetch(
            "/api/rag/ask",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                question,
                topic,
              }),
            }
          );

          const data = await response.json();

          console.log("RAG Response:", data);

          if (!data.success) {
            result.innerHTML = `
              ❌ Error: ${data.message}
            `;

            return;
          }

          displayResults(data);

        } catch (error) {
          console.error("Frontend Error:", error);

          result.innerHTML = `
            ❌ Something went wrong:
            ${error.message}
          `;
        }
      }

      // =========================
      // DISPLAY RESULTS
      // =========================

      function displayResults(data) {
        const result =
          document.getElementById("result");

        let html = `
          <h2>🤖 Answer</h2>

          <p>${data.answer}</p>

          <hr>

          <h3>📚 Relevant Context</h3>
        `;

        // =========================
        // RELEVANT DOCUMENTS
        // Documents that passed
        // the similarity threshold
        // =========================

        if (
          !data.sources ||
          !Array.isArray(data.sources) ||
          data.sources.length === 0
        ) {
          html += `
            <p>
              No documents passed the similarity threshold.
            </p>
          `;
        } else {

          data.sources.forEach((source, index) => {

            const distance =
              typeof source.distance === "number"
                ? source.distance.toFixed(4)
                : "N/A";

            html += `
              <div class="source-card">

                <strong>
                  Source ${index + 1}
                </strong>

                <p>
                  ${source.document || "No document available"}
                </p>

                <p class="distance">

                  Distance:

                  <strong>
                    ${distance}
                  </strong>

                  <span class="relevant">
                    ✅ Relevant
                  </span>

                </p>

                <p>

                  <strong>Topic:</strong>

                  ${
                    source.metadata?.topic ||
                    "Unknown"
                  }

                </p>

                <p>

                  <strong>Title:</strong>

                  ${
                    source.metadata?.title ||
                    "Unknown"
                  }

                </p>

              </div>
            `;
          });
        }

        // =========================
        // ALL RETRIEVED DOCUMENTS
        // Includes documents that
        // were rejected by threshold
        // =========================

        if (
          data.retrievalResults &&
          Array.isArray(data.retrievalResults) &&
          data.retrievalResults.length > 0
        ) {

          html += `
            <hr>

            <h3>
              🔍 All Retrieved Documents
            </h3>

            <p>
              These are the documents returned by
              ChromaDB before similarity filtering.
            </p>
          `;

          data.retrievalResults.forEach(
            (item, index) => {

              const isRelevant =
                typeof item.distance === "number" &&
                item.distance <= DISTANCE_THRESHOLD;

              const distance =
                typeof item.distance === "number"
                  ? item.distance.toFixed(4)
                  : "N/A";

              html += `
                <div class="source-card">

                  <strong>
                    Result ${index + 1}
                  </strong>

                  <p>
                    ${
                      item.document ||
                      "No document available"
                    }
                  </p>

                  <p class="distance">

                    Distance:

                    <strong>
                      ${distance}
                    </strong>

                    ${
                      isRelevant
                        ? `
                          <span class="relevant">
                            ✅ Relevant
                          </span>
                        `
                        : `
                          <span class="rejected">
                            ❌ Rejected
                          </span>
                        `
                    }

                  </p>

                  <p>

                    <strong>Topic:</strong>

                    ${
                      item.metadata?.topic ||
                      "Unknown"
                    }

                  </p>

                  <p>

                    <strong>Title:</strong>

                    ${
                      item.metadata?.title ||
                      "Unknown"
                    }

                  </p>

                </div>
              `;
            }
          );
        }

        result.innerHTML = html;
      }
    </script>
  </body>
</html>
