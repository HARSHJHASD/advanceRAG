<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Advanced RAG Playground</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;

      max-width: 900px;

      margin: 50px auto;

      padding: 20px;

      background: #f5f5f5;
    }

    .container {
      background: white;

      padding: 30px;

      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;

      height: 120px;

      padding: 15px;

      margin-top: 15px;

      font-size: 16px;

      border: 1px solid #ccc;

      border-radius: 8px;

      resize: vertical;
    }

    button {

      margin-top: 15px;

      padding: 12px 24px;

      border: none;

      border-radius: 6px;

      background: black;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #result {

      margin-top: 30px;

      padding: 20px;

      background: #f5f5f5;

      border-radius: 8px;
    }

    .hidden {
      display: none;
    }

    .source-card {

      margin-top: 15px;

      padding: 15px;

      background: white;

      border: 1px solid #ddd;

      border-radius: 8px;
    }

    .distance {

      font-size: 14px;

      margin-top: 10px;
    }

    .relevant {

      font-weight: bold;
    }

    hr {

      margin: 30px 0;

      border: none;

      border-top: 1px solid #ddd;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>
      Advanced RAG Playground 🚀
    </h1>

    <p>
      Ask questions about the documents stored in the vector database.
    </p>

    <textarea
      id="question"
      placeholder="Ask a question..."
    ></textarea>

    <br>

    <button onclick="askQuestion()">
      Ask Question
    </button>

    <div
      id="result"
      class="hidden"
    ></div>

  </div>

  <script>

    const DISTANCE_THRESHOLD = 0.7;

    async function askQuestion() {

      const question =
        document
          .getElementById("question")
          .value;

      const result =
        document
          .getElementById("result");

      if (!question.trim()) {

        alert(
          "Please enter a question"
        );

        return;
      }

      result.classList.remove(
        "hidden"
      );

      result.innerHTML =
        "🔍 Searching knowledge base...";

      try {

        const response =
          await fetch(
            "/api/rag/ask",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                question
              }),
            }
          );

        const data =
          await response.json();

        if (!data.success) {

          result.innerHTML =
            "❌ Error: " +
            data.message;

          return;
        }

        displayResults(data);

      } catch (error) {

        console.error(error);

        result.innerHTML =
          "❌ Something went wrong: " +
          error.message;
      }
    }

    function displayResults(data) {

      const result =
        document
          .getElementById("result");

      let html = `
        <h2>🤖 Answer</h2>

        <p>
          ${data.answer}
        </p>

        <hr>

        <h3>
          📚 Relevant Context
        </h3>
      `;

      // =========================
      // RELEVANT DOCUMENTS
      // =========================

      if (data.sources.length === 0) {

        html += `
          <p>
            No documents passed
            the similarity threshold.
          </p>
        `;

      } else {

        data.sources.forEach(
          (source, index) => {

            html += `
              <div class="source-card">

                <strong>
                  Source ${index + 1}
                </strong>

                <p>
                  ${source.document}
                </p>

                <p class="distance">

                  Distance:

                  <strong>
                    ${source.distance.toFixed(4)}
                  </strong>

                  <span class="relevant">
                    ✅ Relevant
                  </span>

                </p>

              </div>
            `;
          }
        );
      }

      // =========================
      // ALL RETRIEVED RESULTS
      // =========================

      html += `
        <hr>

        <h3>
          🔍 All Retrieved Documents
        </h3>
      `;

      data.retrievalResults.forEach(
        (item, index) => {

          const isRelevant =
            item.distance <=
            DISTANCE_THRESHOLD;

          html += `
            <div class="source-card">

              <strong>
                Result ${index + 1}
              </strong>

              <p>
                ${item.document}
              </p>

              <p class="distance">

                Distance:

                <strong>
                  ${item.distance.toFixed(4)}
                </strong>

                ${

                  isRelevant

                    ? `
                      <span class="relevant">
                        ✅ Relevant
                      </span>
                    `

                    : `
                      <span class="relevant">
                        ❌ Rejected
                      </span>
                    `

                }

              </p>

            </div>
          `;
        }
      );

      result.innerHTML = html;
    }

  </script>

</body>

</html>
